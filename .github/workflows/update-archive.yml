name: Архив обновления ПХГ
# Лёгкий архив (~6 МБ): программы и новые библиотеки, без Python и уже установленных библиотек. Распаковывается поверх PXG_Unified.
# Запускается сам после push с изменениями программ в ветке gas_atlas и раз в сутки (изменения all_scripts), а также вручную.
# Если поменялись Python или версии библиотек, сборка падает с сообщением «Нужен полный архив»: тогда запустите «Единый архив ПХГ».
# Рядом с архивом кладётся .sha256 (контрольная сумма), а размер и sha256 пишутся в сводку запуска: по ним проверяется скачивание.
on:
  workflow_dispatch:
  push:
    branches: [claude/python-backend-ui-update-zdhgen]
    paths: ['atlas/**', 'web/**', 'pxg_hub/**', 'tools/**', 'requirements-lock-py313.txt']
  schedule:
    - cron: '17 3 * * *'
concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  code-update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows, os: windows-2022}
          - {target: linux, os: ubuntu-22.04}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: gas_atlas
      - uses: actions/checkout@v4
        with:
          repository: vlafff2000/all_scripts
          path: all_scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gas_atlas/web/package-lock.json
      - name: Собрать интерфейс (atlas/web/dist в git не хранится, сборка кладёт его в архив)
        run: cd gas_atlas/web && npm ci && npm run build
      - name: Собрать интерфейсы приложений all_scripts (web/dist там тоже не в git)
        run: |
          for app in gsp_maps pxg_base pxg_finder schedule_pxg; do
            (cd all_scripts/$app/web && npm ci && npm run build)
          done
      - name: Манифест последнего полного архива (что уже лежит в архиве у пользователя)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow portable.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then gh run download "$run" --repo "$GITHUB_REPOSITORY" -n Base_manifest_${{ matrix.target }} -D base; fi
          ls base || true
      - name: Build code update (programs and new libraries; fails with «Нужен полный архив» when libraries changed)
        run: cd gas_atlas && python tools/build_unified.py ${{ matrix.target }} --scripts ../all_scripts --code-only --base-manifest ../base/base_manifest.json
      - name: The update has the programs and only the new libraries
        run: |
          cd gas_atlas/dist
          FILE=$(ls PXG_Unified_code_update_*)
          python - "$FILE" "${{ matrix.target }}" <<'PYEOF'
          import sys, zipfile, tarfile
          path, target = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(path).namelist() if path.endswith('.zip') else tarfile.open(path).getnames()
          site = 'python/Lib/site-packages/' if target == 'windows' else 'python/lib/python3.13/site-packages/'
          # записи-каталоги выше site-packages (python/lib, python/lib/python3.13) допустимы
          bad = [n for n in names if (n.startswith('python/') and not n.startswith(site) and not site.startswith(n.rstrip('/') + '/')) or n.split('/')[0] in ('Проект', 'storage', 'logs', '.pxg') or n.endswith(('history.sqlite', 'import_profiles.json', 'well_presets.json'))]
          assert not bad, bad[:10]
          for need in ('pxg_hub/hub.py', 'ОБНОВЛЕНИЕ.txt', 'LIBS_ADDED.txt'):
              assert need in names, need
          print(len(names), 'записей; новые библиотеки:', sum(n.startswith(site) and n.endswith('.dist-info/METADATA') for n in names))
          PYEOF
      - name: Целостность архива и контрольная сумма (sha256, в отдельный файл рядом)
        run: |
          cd gas_atlas/dist
          for f in PXG_Unified_code_update_*; do
            case "$f" in
              *.tar.gz) gzip -t "$f" && tar -tzf "$f" > /dev/null ;;
              *.zip) python -m zipfile -t "$f" > /dev/null ;;
            esac
            sha256sum "$f" > "$f.sha256"
            echo "- \`$f\`: $(wc -c < "$f") байт, sha256 \`$(cut -d' ' -f1 "$f.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          # один файл без обёртки: скачивается сам архив (zip для Windows, tar.gz для РЕД ОС), а не zip с архивом внутри
          name: PXG_Unified_code_update_${{ matrix.target }}
          path: gas_atlas/dist/PXG_Unified_code_update_*${{ matrix.target == 'windows' && '.zip' || '.tar.gz' }}
          archive: false
