name: CI
on:
  push:
    branches: [claude/python-backend-ui-update-zdhgen]
    paths-ignore: &ignore ['docs/**', '**.md', 'storage/**']
  pull_request:
    paths-ignore: *ignore
  workflow_dispatch:
    inputs:
      all_pythons:
        description: 'Run tests on Python 3.8, 3.11 and 3.13 (default: 3.8 only)'
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.all_pythons && '["3.8","3.11","3.13"]' || '["3.8"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (exact lock on 3.8, version ranges on newer Python)
        run: |
          python tools/check_runtime.py
          python -m pip install --upgrade pip
          python -m pip install -r "$(python -c 'import sys;sys.path.insert(0,"tools");from check_runtime import requirements_name;print(requirements_name())')" pytest httpx
      - name: Tests (5.8 + atlas)
        run: python -m pytest tests -q
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build interface
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Built interface is committed
        run: git status --porcelain atlas/web/dist && test -z "$(git status --porcelain atlas/web/dist)"
