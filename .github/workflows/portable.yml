name: Единый архив ПХГ
# Полный архив (Python и все библиотеки) для РЕД ОС 7.3 и Windows 10+. Запускается только вручную: когда меняются Python,
# версии библиотек или состав пакетов. Программы и новые библиотеки доставляет лёгкий архив: update-archive.yml.
# Сборка берёт текущие ветки обоих репозиториев (gas_atlas и all_scripts) и сохраняет base_manifest.json для лёгкого архива.
on:
  workflow_dispatch:
concurrency:
  group: unified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unified:
    # Один архив со всеми приложениями ПХГ (Атлас + База ПХГ + Карты ГСП + Скедул) и меню; отдельные архивы выше не меняются.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows, os: windows-2022}
          - {target: linux, os: ubuntu-22.04}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: gas_atlas
      - uses: actions/checkout@v4
        with:
          repository: vlafff2000/all_scripts
          path: all_scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gas_atlas/web/package-lock.json
      - name: Собрать интерфейс (atlas/web/dist в git не хранится, сборка кладёт его в архив)
        run: cd gas_atlas/web && npm ci && npm run build
      - name: Собрать интерфейсы приложений all_scripts (web/dist там тоже не в git)
        run: |
          for app in gsp_maps pxg_base pxg_finder schedule_pxg; do
            (cd all_scripts/$app/web && npm ci && npm run build)
          done
      - name: Build unified portable folder
        run: cd gas_atlas && python tools/build_unified.py ${{ matrix.target }} --scripts ../all_scripts
      - name: Unpack and check the bundled Python (stdlib, pywin32) before starting anything
        run: |
          mkdir t && cd t
          python -c "import sys,zipfile,tarfile; p=sys.argv[1]; zipfile.ZipFile(p).extractall('.') if p.endswith('.zip') else tarfile.open(p).extractall('.')" ../gas_atlas/dist/PXG_Unified_portable_*
          cd PXG_Unified
          PY=python/bin/python3.13; [ -f python/python.exe ] && PY=python/python.exe
          export PYTHONNOUSERSITE=1 PYTHONUTF8=1
          "$PY" -s -X utf8 -c "import http.server, urllib.parse, urllib.request, email.utils, json, logging, zipfile, sqlite3, ssl; print('stdlib ok', __import__('sys').version.split()[0])"
          if [ -f python/python.exe ]; then "$PY" -s -c "import pythoncom, pywintypes, win32api, win32com.shell.shell; print('pywin32 ok')"; fi
      - name: Start the menu and all four apps from the unpacked archive
        run: |
          cd t/PXG_Unified
          PY=python/bin/python3.13; [ -f python/python.exe ] && PY=python/python.exe
          export PYTHONNOUSERSITE=1
          "$PY" -s -m pxg_hub --server --port 8760 > hub.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8760/api/status > /dev/null && break; sleep 1; done
          for a in atlas base maps schedule; do
            curl -sf -X POST -H 'X-PXG: 1' http://127.0.0.1:8760/api/start/$a
            echo
          done
          curl -sf http://127.0.0.1:8765/api/modules -o probe.json; head -c 120 probe.json; echo
          curl -sf http://127.0.0.1:8766/api/modules -o probe.json; head -c 120 probe.json; echo
          curl -sf http://127.0.0.1:8767/api/state -o probe.json; head -c 120 probe.json; echo
          curl -sf http://127.0.0.1:8768/api/state -o probe.json; head -c 120 probe.json; echo
          curl -sf http://127.0.0.1:8760/api/status | grep -o '"running": true' | wc -l | grep -qx 4
          test -d Проект/logs
          curl -sf -X POST -H 'X-PXG: 1' http://127.0.0.1:8760/api/quit
          sleep 3
          if curl -sf http://127.0.0.1:8765/api/modules; then echo 'Атлас не остановился'; exit 1; fi
          mkdir -p ../desk && "$PY" -s tools/desktop_shortcuts.py --dir ../desk && "$PY" -s -m pxg_core.desktop_shortcuts --dir ../desk
          test "$(ls ../desk | wc -l)" = 8
          test -f PXG_Hub.bat -o -f pxg_hub.sh
      - name: Linux archive on old glibc systems (glibc 2.17 and 2.28)
        if: matrix.target == 'linux'
        run: |
          for image in centos:7 almalinux:8; do
            echo "== $image"
            docker run --rm -v "$PWD/t/PXG_Unified:/app" "$image" \
              bash -c 'cd /app && PYTHONNOUSERSITE=1 python/bin/python3.13 -s -c "import atlas, pxg_hub, pxg_base, gsp_maps, schedule_pxg, pandas, numpy, openpyxl, xlsxwriter, odf, plotly, matplotlib; print(\"imports ok\")"'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PXG_Unified_portable_${{ matrix.target }}
          path: gas_atlas/dist/PXG_Unified_portable_*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Base_manifest_${{ matrix.target }}
          path: gas_atlas/dist/base_manifest.json
