<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
:root{--bg:#fff;--fg:#203c48;--muted:#72858d;--border:#ccd6db;--accent:#16746c;--sel:#d5eeea}*{box-sizing:border-box}body{margin:0;color:var(--fg);background:var(--bg);font:14px system-ui,sans-serif}label.title{font-weight:600;display:block;margin:0 0 7px}input[type=search]{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);padding:7px 9px}button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:5px 9px;cursor:pointer}.tools{display:flex;gap:6px;margin:7px 0;align-items:center}.count{margin-left:auto;color:var(--muted);font-size:12px}.list{height:188px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;user-select:none;outline:none;touch-action:pan-y}.list:focus{border-color:var(--accent)}.row{display:flex;align-items:center;gap:9px;padding:5px 9px;min-height:30px;cursor:default}.row.highlight{background:var(--sel)}input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}.footer{display:flex;align-items:center;gap:9px;margin-top:7px}.apply{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.help{font-size:11px;color:var(--muted);line-height:1.3;flex:1}.empty{padding:15px;color:var(--muted)}
</style></head><body><label class="title" id="title"></label><input type="search" id="search" placeholder="Поиск в списке" aria-label="Поиск в списке"><div class="tools"><button id="all">Все</button><button id="none">Снять</button><span class="count" id="count"></span></div><div class="list" id="list" tabindex="0" role="listbox" aria-multiselectable="true"></div><div class="footer"><button class="apply" id="apply">Применить выбор</button><span class="help">Выделите строки мышью → Пробел. Shift: диапазон; Ctrl: добавить. Изменения применяются одной кнопкой.</span></div><script>
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const list=document.getElementById('list'),search=document.getElementById('search');
let args={},options=[],labels={},checked=new Set(),highlight=new Set(),visible=[],drag=false,anchor=0,lastToken=null;
function count(){document.getElementById('count').textContent=`${checked.size} / ${options.length}`;document.getElementById('apply').textContent=equals(checked,new Set(args.selected||[]))?'Применить выбор':'Применить выбор •';}
function equals(a,b){return a.size===b.size&&[...a].every(x=>b.has(x))}
function paints(){list.querySelectorAll('.row').forEach(r=>{r.classList.toggle('highlight',highlight.has(r.dataset.value));r.setAttribute('aria-selected',highlight.has(r.dataset.value));r.querySelector('input').checked=checked.has(r.dataset.value)});count()}
function selectRange(index,add=false){if(!add)highlight.clear();let low=Math.min(anchor,index),high=Math.max(anchor,index);for(let i=low;i<=high;i++)highlight.add(visible[i]);paints()}
function render(){visible=options.filter(x=>(labels[x]||x).toLocaleLowerCase('ru').includes(search.value.toLocaleLowerCase('ru')));list.replaceChildren();for(const value of visible){const row=document.createElement('div');row.className='row';row.dataset.value=value;row.setAttribute('role','option');const box=document.createElement('input');box.type='checkbox';box.checked=checked.has(value);box.setAttribute('aria-label',labels[value]||value);const text=document.createElement('span');text.textContent=labels[value]||value;row.append(box,text);list.append(row);box.addEventListener('pointerdown',e=>e.stopPropagation());box.addEventListener('change',()=>{box.checked?checked.add(value):checked.delete(value);count()});row.addEventListener('pointerdown',e=>{if(e.target===box)return;e.preventDefault();list.focus();const i=visible.indexOf(value);if(e.shiftKey){selectRange(i,e.ctrlKey||e.metaKey)}else{anchor=i;if(!e.ctrlKey&&!e.metaKey)highlight.clear();highlight.has(value)?highlight.delete(value):highlight.add(value);paints()}drag=true});row.addEventListener('pointerenter',()=>{if(drag)selectRange(visible.indexOf(value),false)})}if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Нет совпадений';list.append(empty)}paints();send('streamlit:setFrameHeight',{height:370})}
window.addEventListener('pointerup',()=>drag=false);window.addEventListener('blur',()=>drag=false);search.addEventListener('input',render);
list.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!highlight.size&&visible.length)highlight.add(visible[Math.min(anchor,visible.length-1)]);const enable=[...highlight].some(x=>!checked.has(x));for(const value of highlight)enable?checked.add(value):checked.delete(value);paints()}else if(e.key==='a'&&(e.ctrlKey||e.metaKey)){e.preventDefault();highlight=new Set(visible);paints()}else if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();anchor=Math.max(0,Math.min(visible.length-1,anchor+(e.key==='ArrowDown'?1:-1)));highlight=new Set(visible[anchor]?[visible[anchor]]:[]);paints();list.querySelectorAll('.row')[anchor]?.scrollIntoView({block:'nearest'})}});
document.getElementById('all').onclick=()=>{for(const x of visible)checked.add(x);paints()};document.getElementById('none').onclick=()=>{for(const x of visible)checked.delete(x);paints()};document.getElementById('apply').onclick=()=>send('streamlit:setComponentValue',{value:{values:options.filter(x=>checked.has(x)),token:args.token}});
window.addEventListener('message',event=>{if(event.data.type!=='streamlit:render')return;const next=event.data.args;args=next;options=next.options;labels=next.labels||{};document.getElementById('title').textContent=next.label;search.setAttribute('aria-label','Поиск: '+next.label);if(next.token!==lastToken){checked=new Set(next.selected);highlight.clear();lastToken=next.token;render()}else count();const theme=event.data.theme;if(theme){for(const [key,value] of Object.entries({'--bg':theme.backgroundColor,'--fg':theme.textColor,'--accent':theme.primaryColor,'--sel':theme.secondaryBackgroundColor}))if(value)document.documentElement.style.setProperty(key,value)}send('streamlit:setFrameHeight',{height:370})});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
